[project]
name = "kuku-promo-lab"
version = "0.1.0"
description = "Source-grounded screenplay promo discovery and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["certifi>=2024.7.4"]
documents = ["reportlab>=4.0", "pypdf>=5.0"]
dev = ["ruff==0.15.1"]

[project.scripts]
promo-lab = "promo_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promo_lab*"]

[tool.setuptools.package-data]
promo_lab = ["web/*", "examples/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
