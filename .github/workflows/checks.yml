name: Prototype checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and formatting
        run: |
          ruff check promo_lab scripts tests
          ruff format --check promo_lab scripts tests
      - name: Unit tests (no API calls or private inputs)
        run: python -m unittest discover -s tests -v
      - name: Source hygiene
        run: python scripts/check_repository.py
      - name: Run and audit the original demo
        run: |
          python -m promo_lab run promo_lab/examples --output output/runs/ci-demo
          python scripts/audit_run.py output/runs/ci-demo
      - name: Check the local HTTP interface
        run: python scripts/run_http_checks.py

  browser:
    name: Browser and synthetic demonstration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install optional browser development tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend formatting
        run: npm run format:check
      - name: Check browser flows with original public fiction
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/run_http_checks.py --browser
